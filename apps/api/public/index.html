<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SplitEase API</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0b1020;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      main {
        max-width: 520px;
        padding: 32px;
      }
      code {
        background: #1e293b;
        padding: 2px 6px;
        border-radius: 6px;
      }
      a {
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>💸 SplitEase API</h1>
      <p>
        GraphQL endpoint: <code>POST /graphql</code> &middot; health: <a href="/health"><code>/health</code></a>
      </p>
      <p>
        Introspection and GraphiQL are disabled in production. Run the API locally (<code>npm run dev:api</code>) for
        GraphiQL at <code>http://localhost:4600/graphql</code>.
      </p>
      <p><a href="https://splitease-lalit.vercel.app">Open the app →</a></p>
    </main>
  </body>
</html>
